openapi: 3.1.0
info:
  title: Marcaí API
  version: 0.1.0
  description: Agenda online com cobrança para profissionais autônomos.
paths:
  /profissionais/{profissionalId}/agendamentos:
    parameters:
      - { name: profissionalId, in: path, required: true, schema: { type: string } }
    get:
      summary: Lista os agendamentos do profissional, do mais cedo para o mais tarde, paginado
      parameters:
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: porPagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Uma página de agendamentos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaDeAgendamentos' }
    post:
      summary: Cria um agendamento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoAgendamento' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
        '409': { description: Horário em conflito com outro agendamento }
  /profissionais/{profissionalId}/agendamentos/{id}/cancelar:
    parameters:
      - { name: profissionalId, in: path, required: true, schema: { type: string } }
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Cancela um agendamento
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agendamento' }
  /servicos/{servicoId}/pacotes:
    parameters:
      - { name: servicoId, in: path, required: true, schema: { type: string } }
    get:
      summary: Lista os pacotes de um serviço
      responses:
        '200':
          description: Pacotes
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Pacote' } }
    post:
      summary: Cria um pacote de sessões com desconto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoPacote' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pacote' }
components:
  schemas:
    StatusAgendamento:
      type: string
      enum: [CONFIRMADO, CANCELADO, FALTOU, CONCLUIDO]
    Agendamento:
      type: object
      required: [id, servicoId, clienteNome, clienteEmail, inicio, fim, status]
      properties:
        id: { type: string }
        servicoId: { type: string }
        clienteNome: { type: string }
        clienteEmail: { type: string }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/StatusAgendamento' }
    PaginaDeAgendamentos:
      type: object
      required: [itens, pagina, porPagina, total]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/Agendamento' } }
        pagina: { type: integer }
        porPagina: { type: integer }
        total: { type: integer, description: Total de agendamentos, somando todas as páginas }
    NovoAgendamento:
      type: object
      required: [servicoId, clienteNome, clienteEmail, inicio]
      properties:
        servicoId: { type: string }
        clienteNome: { type: string }
        clienteEmail: { type: string, format: email }
        inicio: { type: string, format: date-time }
    Pacote:
      type: object
      required: [id, servicoId, sessoes, descontoPercentual, valorCentavos]
      properties:
        id: { type: string }
        servicoId: { type: string }
        sessoes: { type: integer }
        descontoPercentual: { type: integer }
        valorCentavos: { type: integer, description: Valor total do pacote, em centavos }
    NovoPacote:
      type: object
      required: [sessoes, descontoPercentual]
      properties:
        sessoes: { type: integer, minimum: 2, maximum: 50 }
        descontoPercentual: { type: integer, minimum: 0, maximum: 90 }
